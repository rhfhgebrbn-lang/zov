<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение не отвечает</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1c1c1e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            width: 80%;
            max-width: 300px;
            background-color: #2c2c2e;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { font-size: 20px; margin-bottom: 10px; }
        p { font-size: 16px; margin-bottom: 20px; color: #aeaeb2; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            background-color: transparent;
            border: none;
            border-top: 1px solid #3a3a3c;
            color: #0a84ff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h2>Ошибка</h2>
        <p>Не удалось загрузить содержимое. Попробуйте ещё раз.</p>
        <button class="btn">Повторить</button>
    </div>

    <script>
        // Создаем генератор звука сирены на случай блокировки внешних файлов
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isStarted = false;

        function startSiren() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            
            // Сирена: плавный перепад высоты тона от 400 Гц до 800 Гц
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(400, now);
            
            // Циклический подъем и спуск тона
            let time = now;
            for (let i = 0; i < 50; i++) {
                osc.frequency.linearRampToValueAtTime(800, time + 1.5);
                osc.frequency.linearRampToValueAtTime(400, time + 3.0);
                time += 3.0;
            }

            gain.gain.setValueAtTime(1.0, now); // Максимальная громкость

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        document.body.addEventListener('click', () => {
            if (isStarted) return;
            isStarted = true;

            document.getElementById('app').style.display = 'none';
            startSiren();
        });
    </script>
</body>
</html>
